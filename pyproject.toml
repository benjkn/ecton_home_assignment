[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipe-normalizer"
version = "1.0.0"
description = "Normalize cooking recipes from XML, YAML, JSON, and TOML into a consistent JSON format."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Recipe Normalizer" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
recipe-normalizer = "recipe_normalizer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
